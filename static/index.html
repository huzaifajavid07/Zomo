<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomo - Dashboard</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="navbar">
            <div class="navbar-content">
                <div style="display: flex; align-items: center; gap: 14px;">
                    <div class="brand-mark" style="width: 38px; height: 38px; font-size: 1.1rem; border-radius: 10px; font-weight: 800;">Z</div>
                    <div style="display: flex; flex-direction: column;">
                        <span style="font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px;">Zomo</span>
                        <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Meeting Bot Dashboard</span>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn btn-ghost" id="themeToggleBtn" data-action="toggle-theme" onclick="toggleTheme()">
                        ☀️ <span class="theme-text">Light Mode</span>
                    </button>
                    <button class="btn btn-ghost" data-action="go-admin">
                        👥 User Management
                    </button>
                    <button class="btn-settings" data-action="user-settings" onclick="openUserSettings()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 0l4.24-4.24M1 12h6m6 0h6m-1.78 7.78l-4.24-4.24m-5.08 0l-4.24 4.24"></path>
                        </svg>
                        User Settings
                    </button>
                    <button class="btn btn-danger" data-action="logout-dashboard">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Column: Meetings Table -->
            <section class="column column-left">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">All Meetings</h2>
                        <button class="btn btn-primary" onclick="downloadTodayDetails()" style="font-size: 11px; padding: 8px 12px;">
                            DOWNLOAD TODAY'S DETAILS
                        </button>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Meeting ID</th>
                                    <th>Bots</th>
                                    <th>Start Time</th>
                                    <th>Timeout</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="meetingsTableBody">
                                <!-- Populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Middle Column: Bot Configuration Form -->
            <section class="column column-middle">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Add Bot Participant</h2>
                    </div>

                    <form class="config-form" id="botConfigForm">
                        <div class="form-group">
                            <label for="meetingId">Meeting ID or URL</label>
                            <input type="text" id="meetingId" name="meetingId" placeholder="e.g., 950 8442 2783 or Zoom URL" required>
                        </div>

                        <div class="form-group">
                            <label for="meetingPassword">Meeting Password (Passcode)</label>
                            <input type="password" id="meetingPassword" name="meetingPassword" placeholder="Enter meeting passcode (optional)">
                        </div>

                        <div class="form-group">
                            <label for="botUsersCount">Bot Users Count</label>
                            <input type="number" id="botUsersCount" name="botUsersCount" placeholder="5" min="1" max="50" value="5" required>
                        </div>

                        <div class="form-group">
                            <label for="nameLocale">Name Locale</label>
                            <input type="text" id="nameLocale" name="nameLocale" placeholder="e.g., en-US" value="en-US">
                        </div>

                        <div class="form-group">
                            <label for="timeout">Timeout (in Minutes)</label>
                            <input type="number" id="timeout" name="timeout" placeholder="60" min="1" value="60" required>
                        </div>

                        <div class="form-group">
                            <label for="vcType">VC Type (Video Conference Type)</label>
                            <select id="vcType" name="vcType" required>
                                <option value="zoom">Zoom Meeting</option>
                                <option value="google">Google Meet</option>
                                <option value="jitsi">Jitsi</option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">SUBMIT & LAUNCH</button>
                            <button type="reset" class="btn btn-danger">CANCEL</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Right Column: Analytics Chart -->
            <section class="column column-right">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Bot Status Distribution</h2>
                    </div>

                    <div class="chart-container">
                        <canvas id="statusChart"></canvas>
                    </div>

                    <div class="chart-legend">
                        <div class="legend-item">
                            <span class="legend-dot" style="background-color: #10b981;"></span>
                            <span>Active</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background-color: #f59e0b;"></span>
                            <span>Queued</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background-color: #3b82f6;"></span>
                            <span>Completed</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background-color: #ef4444;"></span>
                            <span>Failed</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for Edit -->
    <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Meeting</h3>
                <button class="modal-close" onclick="closeEditModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="form-group">
                        <label for="editMeetingId">Meeting ID</label>
                        <input type="text" id="editMeetingId" required>
                    </div>
                    <div class="form-group">
                        <label for="editBotCount">Bot Users Count</label>
                        <input type="number" id="editBotCount" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="editTimeout">Timeout (minutes)</label>
                        <input type="number" id="editTimeout" min="1" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">UPDATE</button>
                        <button type="button" class="btn btn-danger" onclick="closeEditModal()">CLOSE</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/utils/helpers.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/analytics.js"></script>
</body>
</html>
