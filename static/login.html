<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomo - Login</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <header class="auth-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="brand-block">
                    <div class="brand-mark">Z</div>
                    <div>
                        <div class="eyebrow">Virtual Meeting Management</div>
                        <h1 class="auth-title">Zomo Login</h1>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="themeToggleBtn" data-action="toggle-theme" onclick="toggleTheme()" style="padding: 6px 10px; font-size: 11px;">
                    ☀️ <span class="theme-text">Light</span>
                </button>
            </header>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" placeholder="admin@example.com" value="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter password" value="admin123" required>
                </div>

                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" checked>
                        Remember me
                    </label>
                    <a class="link" href="#">Need help?</a>
                </div>

                <div class="form-actions auth-actions">
                    <button class="btn btn-primary" type="submit">Login to Dashboard</button>
                </div>

                <div id="loginError" class="auth-error" aria-live="polite"></div>
            </form>

            <div class="auth-demo-box">
                Demo admin credentials: <strong>admin@example.com</strong> / <strong>admin123</strong>
            </div>
        </div>
    </div>

    <script src="/static/utils/helpers.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
